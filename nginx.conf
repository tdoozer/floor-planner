server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Обратный прокси на Pollinations — обход CORS и блокировок провайдера.
    # Тот же приём, что в landscape-app: используется фолбэком для ИИ-рендера,
    # когда ключ Imagen не задан. Понадобится на этапе 5 (визуализация).
    location /prompt/ {
        proxy_pass https://image.pollinations.ai/prompt/;
        proxy_ssl_server_name on;
        proxy_set_header Host image.pollinations.ai;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
